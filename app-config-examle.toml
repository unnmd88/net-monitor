strategy = "parallel"

log = "monitor.json"

[network]
target = "8.8.8.8"

[ping]
timeout_seconds = 3
fallback_tracert = true
fallback_tracert_delay_seconds = 1 

[tracert]
max_hops = 30
probe_timeout_seconds = 1
queries_per_hop = 1

[snmp]
timeout_seconds = 3
port = 161
community = "UTMC"
retries = 0
oids = [
    "1.3.6.1.2.1.1.3.0",
    "1.3.6.1.4.1.13267.3.2.4.1",
]

# Стратегия параллельного опроса
[parallel.ping]
enabled = true
interval_seconds = 4

[parallel.snmp]
enabled = true
interval_seconds = 4

# Стратегия последовательного орпоса
[sequential]
interval_seconds = 4
sequence = ["ping", "snmp"]


