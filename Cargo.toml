[package]
name = "net-monitor"
version = "0.1.0"
edition = "2024"

[dependencies]
async-snmp = "0.12.0"
async-trait = "0.1.89"
chrono = "0.4.44"
ftr = { version = "0.7.0", default-features = false, features = ["async"] }
ping-async = "1.0.2"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
tracing = { version = "0.1.44", features = ["log", "attributes"] }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
