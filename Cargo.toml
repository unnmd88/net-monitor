[package]
name = "net-monitor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-fd-lock = "0.2.0"
async-snmp = "0.12.0"
async-trait = "0.1.89"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
colored_json = "5.0.0"
csv = "1.4.0"
futures-util = "0.3.32"
ping-async = "1.0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
tracing = { version = "0.1.44", features = ["log", "attributes"] }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
trippy-core = "0.13.0"
uuid = { version = "1.23.3", features = ["v4", "serde"] }

[[example]]
name = "test_traceroute"
path = "examples/test_traceroute.rs"
